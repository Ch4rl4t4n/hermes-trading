# Krypto (24/7) | Category 3 — Volatile: agresívny, momentum + breakouts, ~1–7d
name: "SOL Agent"
symbol: "SOL/USD"
asset_type: crypto
strategy: volatile
enabled: true
trade_usd: 50
trading_mode: day_trading

schedule:
  timezone: "UTC"
  active_hours: "00:00-23:59"
  check_interval_seconds: 900  # 15m
  timeframe: "15m"

rule_based:
  rsi_period: 14
  rsi_buy_threshold: 25
  rsi_sell_threshold: 75
  macd_enabled: true
  signal_confidence_threshold: 0.65

llm:
  enabled: true
  trigger_threshold: 0.70
  model: claude-opus-4-7
  max_calls_per_hour: 6
  use_sonnet_above: 0.85

risk:
  trailing_stop_pct: 5.0
  trailing_activate_pct: 6.0
  take_profit_pct: 12.0
  max_trades_per_day: 10
  max_daily_loss_pct: 2.5
  max_position_pct: 0.05
  atr_position_sizing: true
