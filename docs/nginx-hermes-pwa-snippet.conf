# Hermes dashboard — Nginx snippets for PWA + compression
#
# Merge inside server { ... } for https://letagentscook.lol (HTTPS block in sites-available/hermes).
# /static/ MUST proxy_pass to Flask; expires-only without proxy would 404.
#
# OAuth (Google): ak máte ``try_files … /index.html`` pre SPA, BEZ týchto blokov ostane
# používateľ na ``/login/google`` so SPA loginom a OAuth sa nikdy nespustí.
# ``/api/auth/google/start`` presmeruje na ``/oauth/google`` — ten request musí ísť do Flasku.

location ^~ /oauth/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /login/google {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
gzip_min_length 1000;

location /static/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location = /sw.js {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /.well-known/assetlinks.json {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Security headers (also set in Flask; duplicate here for static/error responses)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
