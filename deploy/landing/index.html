<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>LETAGENTSCOOK — AI Trading</title>
  <style>
    :root {
      --bg: #07080d;
      --card: #0d0f17;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.5;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .logo {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    a.btn:hover { opacity: 0.92; transform: scale(1.02); }
    a.primary {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.45);
      color: #a5b4fc;
    }
    a.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="logo">LETAGENTSCOOK</div>
    <h1>AI-assisted trading</h1>
    <p>Launch the dashboard to manage agents, portfolio, and paper trading in one place.</p>
    <div class="actions">
      <a class="btn primary" href="https://app.letagentscook.lol">Launch App</a>
      <a class="btn secondary" href="https://app.letagentscook.lol">Start Free</a>
    </div>
  </div>
  <footer><a href="https://app.letagentscook.lol" style="color: inherit;">app.letagentscook.lol</a></footer>
</body>
</html>
