# Komodita ETF (RTH) | Category 1 — zlato, macro hedge, Fed-reactive, ~5–15d
name: "GLD Agent"
symbol: "GLD"
asset_type: commodity_etf
strategy: stable
enabled: true
trade_usd: 80
trading_mode: day_trading

schedule:
  timezone: "America/New_York"
  active_hours: "09:30-16:00"
  check_interval_seconds: 14400
  timeframe: "4h"

rule_based:
  rsi_period: 14
  rsi_buy_threshold: 30
  rsi_sell_threshold: 70
  macd_enabled: true
  signal_confidence_threshold: 0.60

llm:
  enabled: true
  trigger_threshold: 0.70
  model: claude-opus-4-7
  max_calls_per_hour: 4
  use_sonnet_above: 0.88

risk:
  trailing_stop_pct: 3.0
  trailing_activate_pct: 4.0
  take_profit_pct: 8.0
  max_trades_per_day: 4
  max_daily_loss_pct: 1.5
  max_position_pct: 0.06
  atr_position_sizing: false
