# Krypto (24/7) | Category 2 — Trending: vyvážený, mean reversion + breakouts, ~3–10d
name: "ETH Agent"
symbol: "ETH/USD"
asset_type: crypto
strategy: trending
enabled: true
trade_usd: 70
trading_mode: day_trading

schedule:
  timezone: "UTC"
  active_hours: "00:00-23:59"
  check_interval_seconds: 3600  # 1h
  timeframe: "1h"

rule_based:
  rsi_period: 14
  rsi_buy_threshold: 35
  rsi_sell_threshold: 65
  macd_enabled: true
  signal_confidence_threshold: 0.60

llm:
  enabled: true
  trigger_threshold: 0.65
  model: claude-opus-4-7
  max_calls_per_hour: 6
  use_sonnet_above: 0.85

risk:
  trailing_stop_pct: 4.0
  trailing_activate_pct: 5.0
  take_profit_pct: 10.0
  max_trades_per_day: 8
  max_daily_loss_pct: 2.0
  max_position_pct: 0.06
  atr_position_sizing: false
