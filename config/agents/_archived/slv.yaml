name: "SLV Agent"
symbol: "SLV"
asset_type: commodity_etf
enabled: true
trade_usd: 50

schedule:
  timezone: "America/New_York"
  active_hours: "09:30-16:00"
  check_interval_seconds: 60

rule_based:
  rsi_period: 14
  rsi_buy_threshold: 40
  rsi_sell_threshold: 60
  macd_enabled: true
  signal_confidence_threshold: 0.65

llm:
  enabled: false
  trigger_threshold: 0.70
  model: haiku
  max_calls_per_hour: 4
  use_sonnet_above: 0.88

risk:
  trailing_stop_pct: 2.5
  take_profit_pct: 5.0
  max_trades_per_day: 6
  max_daily_loss_pct: 1.5
  max_position_pct: 0.05
