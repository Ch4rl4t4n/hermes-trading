# Krypto (24/7) | Category 1 — Stable: konzervatívny, trend-following, ~5–15d
name: "BTC Agent"
symbol: "BTC/USD"
asset_type: crypto
strategy: stable
enabled: true
trade_usd: 80
trading_mode: day_trading

schedule:
  timezone: "UTC"
  active_hours: "00:00-23:59"
  check_interval_seconds: 14400  # 4h bar cadence
  timeframe: "4h"

rule_based:
  rsi_period: 14
  rsi_buy_threshold: 30
  rsi_sell_threshold: 70
  macd_enabled: true
  signal_confidence_threshold: 0.60

llm:
  enabled: true
  trigger_threshold: 0.65
  model: claude-opus-4-7
  max_calls_per_hour: 6
  use_sonnet_above: 0.85

risk:
  trailing_stop_pct: 3.0
  trailing_activate_pct: 4.0
  take_profit_pct: 8.0
  max_trades_per_day: 6
  max_daily_loss_pct: 2.0
  max_position_pct: 0.06
  atr_position_sizing: false
